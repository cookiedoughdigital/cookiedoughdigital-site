name: PR preview build (no Pages publish)
on:
  pull_request:
  push: { branches-ignore: [main] }
  workflow_dispatch:
permissions: { contents: read, pull-requests: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4", cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist-${{ github.sha }}
          path: dist
          retention-days: 14
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Build OK for ${{ github.sha }}. Download artifact `preview-dist-${{ github.sha }}` from the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Preview locally: on the branch run `npm ci && npm run build && npm run preview`.
